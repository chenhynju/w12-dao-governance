name: Solidity checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge lint src script
      - run: forge test -vv --fuzz-seed 0x1234
